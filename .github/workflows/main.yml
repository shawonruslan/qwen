name: Qwen Chat - Image Paste Test
on:
  workflow_dispatch:
jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create test image
        run: |
          # Create a simple test PNG using a tiny base64-encoded image
          python3 -c "
          import base64
          png_b64 = ''
          with open('test-screenshot.png', 'wb') as f:
              f.write(base64.b64decode(png_b64))
          "
          ls -la test-screenshot.png

      - name: Create Playwright Automation Script
        run: |
          cat << 'EOF' > login_and_paste.js
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({
              permissions: ['clipboard-read', 'clipboard-write']
            });
            const page = await context.newPage();

            try {
              console.log('Navigating to auth page...');
              await page.goto('https://chat.qwen.ai/auth');
              await page.waitForSelector('input[name="email"]');

              console.log('Filling credentials...');
              await page.fill('input[name="email"]', process.env.USER_EMAIL);
              await page.fill('input[name="password"]', process.env.USER_PASSWORD);

              console.log('Submitting form and waiting for redirect...');
              await Promise.all([
                page.waitForURL('https://chat.qwen.ai/**', { waitUntil: 'load', timeout: 15000 }),
                page.press('input[name="password"]', 'Enter')
              ]);

              console.log('Waiting for chat input box to appear...');
              const textarea = await page.waitForSelector('textarea.message-input-textarea', {
                state: 'visible',
                timeout: 20000
              });
              await page.waitForTimeout(1000);

              console.log('Reading test image into memory...');
              const imagePath = path.resolve('test-screenshot.png');
              const imageBuffer = fs.readFileSync(imagePath);
              const base64Image = imageBuffer.toString('base64');

              console.log('Simulating clipboard paste of image into chat input...');
              await textarea.click();

              // Build a real ClipboardEvent with image data and dispatch it on the textarea,
              // so the page's own paste-handler (the same one a real Ctrl+V would trigger) runs.
              await page.evaluate(async ({ base64Image }) => {
                const byteChars = atob(base64Image);
                const byteNumbers = new Array(byteChars.length);
                for (let i = 0; i < byteChars.length; i++) {
                  byteNumbers[i] = byteChars.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'image/png' });
                const file = new File([blob], 'test-screenshot.png', { type: 'image/png' });

                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);

                const pasteEvent = new ClipboardEvent('paste', {
                  clipboardData: dataTransfer,
                  bubbles: true,
                  cancelable: true
                });

                const target = document.querySelector('textarea.message-input-textarea');
                target.dispatchEvent(pasteEvent);
              }, { base64Image });

              console.log('Waiting for image thumbnail to appear in input area...');
              const imageAttached = await page.waitForSelector('.vision-item-image', {
                state: 'visible',
                timeout: 10000
              }).then(() => true).catch(() => false);

              if (!imageAttached) {
                console.log('Synthetic paste event did not trigger upload — falling back to file input method...');
                const fileInput = await page.$('#filesUpload');
                await fileInput.setInputFiles(imagePath);
                await page.waitForSelector('.vision-item-image', { state: 'visible', timeout: 15000 });
                console.log('Image attached via file input fallback.');
              } else {
                console.log('Image attached via simulated paste.');
              }

              console.log('Typing prompt text...');
              await textarea.click();
              await textarea.fill('explain this image');

              console.log('Sending message...');
              const sendButton = await page.waitForSelector('button.send-button', {
                state: 'visible',
                timeout: 10000
              });
              await sendButton.click();

              console.log('Waiting for assistant response to appear...');
              const assistantSelector = '.qwen-chat-message-assistant .qwen-markdown-text';
              await page.waitForSelector(assistantSelector, { timeout: 30000 });

              console.log('Waiting for response to finish streaming...');
              let previousText = '';
              let stableCount = 0;
              for (let i = 0; i < 60; i++) { // up to ~30s
                const currentText = await page.$eval(assistantSelector, el => el.textContent).catch(() => '');
                if (currentText && currentText === previousText) {
                  stableCount++;
                  if (stableCount >= 3) break;
                } else {
                  stableCount = 0;
                }
                previousText = currentText;
                await page.waitForTimeout(500);
              }

              const responseText = await page.$eval(assistantSelector, el => el.textContent).catch(() => '(no response captured)');
              console.log('=========================================');
              console.log('Assistant response about the image:');
              console.log(responseText);
              console.log('=========================================');

              await page.waitForTimeout(1000);
              console.log('Taking screenshot...');
              await page.screenshot({ path: 'screenshot.png' });
            } catch (error) {
              console.error('Something went wrong:', error);
              await page.screenshot({ path: 'screenshot.png', fullPage: true }).catch(() => {});
              const html = await page.content().catch(() => '');
              fs.writeFileSync('page.html', html);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Script - Login, Paste Image, Get Response
        env:
          USER_EMAIL: ${{ secrets.QWEN_EMAIL }}
          USER_PASSWORD: ${{ secrets.QWEN_PASSWORD }}
        run: node login_and_paste.js

      - name: Upload Screenshot and Debug Files as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-image-test
          path: |
            screenshot.png
            page.html
            test-screenshot.png
          if-no-files-found: ignore
