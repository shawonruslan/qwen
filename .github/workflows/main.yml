name: Take Screenshot of Qwen Chat

on:
  workflow_dispatch: # Triggers manually from the GitHub Actions tab

jobs:
  take-screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create Playwright Automation Script
        run: |
          cat << 'EOF' > login_and_screenshot.js
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            
            try {
              console.log('Navigating to auth page...');
              await page.goto('https://chat.qwen.ai/auth');

              await page.waitForSelector('input[name="email"]');
              
              console.log('Filling credentials...');
              await page.fill('input[name="email"]', process.env.USER_EMAIL);
              await page.fill('input[name="password"]', process.env.USER_PASSWORD);

              console.log('Submitting form and waiting for redirect...');
              // SMART WAIT: Hits Enter and waits for the page to visually load the chat interface
              await Promise.all([
                page.waitForURL('https://chat.qwen.ai/**', { waitUntil: 'load', timeout: 15000 }),
                page.press('input[name="password"]', 'Enter')
              ]);

              console.log('Success! Taking screenshot of the chat...');
              await page.screenshot({ path: 'screenshot.png' });

            } catch (error) {
              console.error('Something went wrong:', error);
              console.log('Taking a fallback screenshot to see the error/captcha...');
              // If it fails (e.g., Captcha block), take a screenshot of whatever stopped it
              await page.screenshot({ path: 'screenshot.png', fullPage: true });
              process.exit(1); // Tell GitHub Actions the script caught an error
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Script to Login and Screenshot
        env:
          # Pulls the secure credentials you set in GitHub Repo Secrets
          USER_EMAIL: ${{ secrets.QWEN_EMAIL }}
          USER_PASSWORD: ${{ secrets.QWEN_PASSWORD }}
        run: node login_and_screenshot.js

      - name: Upload Screenshot via Curl
        if: always() # IMPORTANT: Uploads the screenshot even if the login failed
        run: |
          if [ -f screenshot.png ]; then
            echo "Uploading to file.io..."
            
            # Uploads the file using curl and extracts the link using jq
            URL=$(curl -s -F "file=@screenshot.png" https://file.io | jq -r '.link')
            
            echo "=========================================="
            echo "✅ Screenshot uploaded successfully!"
            echo "🔗 View your image here (WARNING: Link expires after 1 click):"
            echo "$URL"
            echo "=========================================="
          else
            echo "❌ Screenshot file not found. The script crashed before capturing anything."
          fi
