name: Take Screenshot of Qwen Chat
on:
  workflow_dispatch:
jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create Playwright Automation Script
        run: |
          cat << 'EOF' > login_and_screenshot.js
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();

            try {
              console.log('Navigating to auth page...');
              await page.goto('https://chat.qwen.ai/auth');
              await page.waitForSelector('input[name="email"]');

              console.log('Filling credentials...');
              await page.fill('input[name="email"]', process.env.USER_EMAIL);
              await page.fill('input[name="password"]', process.env.USER_PASSWORD);

              console.log('Submitting form and waiting for redirect...');
              await Promise.all([
                page.waitForURL('https://chat.qwen.ai/**', { waitUntil: 'load', timeout: 15000 }),
                page.press('input[name="password"]', 'Enter')
              ]);

              console.log('Waiting for chat input box to appear...');
              const textarea = await page.waitForSelector('textarea.message-input-textarea', {
                state: 'visible',
                timeout: 20000
              });

              // let the page settle
              await page.waitForTimeout(1000);

              console.log('Typing "hi" into chat input...');
              await textarea.click();
              await textarea.fill('hi');

              console.log('Sending message...');
              const sendButton = await page.waitForSelector('button.send-button', {
                state: 'visible',
                timeout: 10000
              });
              await sendButton.click();

              console.log('Waiting for assistant response to appear...');
              const assistantSelector = '.qwen-chat-message-assistant .qwen-markdown-text';
              await page.waitForSelector(assistantSelector, { timeout: 30000 });

              console.log('Waiting for response to finish streaming...');
              // Poll until the assistant text stops changing (streaming finished)
              let previousText = '';
              let stableCount = 0;
              const maxAttempts = 40; // ~20s max
              for (let i = 0; i < maxAttempts; i++) {
                const currentText = await page.$eval(assistantSelector, el => el.textContent).catch(() => '');
                if (currentText && currentText === previousText) {
                  stableCount++;
                  if (stableCount >= 3) break; // stable for ~1.5s
                } else {
                  stableCount = 0;
                }
                previousText = currentText;
                await page.waitForTimeout(500);
              }

              const responseText = await page.$eval(assistantSelector, el => el.textContent).catch(() => '(no response captured)');
              console.log('=========================================');
              console.log('Assistant response:');
              console.log(responseText);
              console.log('=========================================');

              // small buffer for any final UI settling
              await page.waitForTimeout(1000);

              console.log('Taking screenshot...');
              await page.screenshot({ path: 'screenshot.png' });
            } catch (error) {
              console.error('Something went wrong:', error);
              console.log('Taking a fallback screenshot to see the error/captcha...');
              await page.screenshot({ path: 'screenshot.png', fullPage: true }).catch(() => {});
              const html = await page.content().catch(() => '');
              require('fs').writeFileSync('page.html', html);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Script to Login, Chat, and Screenshot
        env:
          USER_EMAIL: ${{ secrets.QWEN_EMAIL }}
          USER_PASSWORD: ${{ secrets.QWEN_PASSWORD }}
        run: node login_and_screenshot.js

      - name: Upload Screenshot and Debug HTML as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-screenshot
          path: |
            screenshot.png
            page.html
          if-no-files-found: ignore
