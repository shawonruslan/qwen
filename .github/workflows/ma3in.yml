name: WaveSpeed Desktop via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update

          sudo apt install -y \
            wget \
            curl \
            xvfb \
            xfce4 \
            x11vnc \
            novnc \
            websockify \
            openbox \
            python3 \
            unzip

      - name: Download cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: Download WaveSpeed Desktop
        run: |
          wget -O wavespeed.AppImage \
            https://github.com/WaveSpeedAI/wavespeed-desktop/releases/latest/download/WaveSpeed-Desktop-linux-x86_64.AppImage

          chmod +x wavespeed.AppImage

      - name: Start Virtual Desktop
        run: |
          export DISPLAY=:99

          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

          openbox &
          sleep 2

      - name: Start WaveSpeed
        run: |
          export DISPLAY=:99

          ./wavespeed.AppImage --appimage-extract

          ./squashfs-root/AppRun &
          sleep 15

      - name: Start VNC
        run: |
          export DISPLAY=:99

          x11vnc \
            -display :99 \
            -forever \
            -nopw \
            -shared \
            -rfbport 5900 &
          sleep 5

      - name: Start noVNC
        run: |
          /usr/share/novnc/utils/novnc_proxy \
            --vnc localhost:5900 \
            --listen 6080 &
          sleep 10

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel \
            --url http://localhost:6080 \
            --no-autoupdate > tunnel.log 2>&1 &

          sleep 15

          echo "==============================="
          echo "Cloudflare URL:"
          grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' tunnel.log | head -1
          echo "==============================="

      - name: Keep Runner Alive
        run: |
          while true; do
            sleep 60
          done
